rules:
  - id: c-comment-without-workaround-tag
    languages: [generic]
    severity: ERROR
    message: >-
      Comments are only for unexpected workarounds (WORKAROUND:) and for
      facts a name cannot carry, such as hardware behaviour or ordering
      (WHY:), written as /* */ comments because // is not C89. Otherwise
      rename or restructure the code so it explains itself.
    paths:
      include:
        - "*.c"
        - "*.h"
    pattern-regex: '//.*|/\*(?!\s*(?:WORKAROUND|WHY):)'

  - id: asm-comment-without-workaround-tag
    languages: [generic]
    severity: ERROR
    message: >-
      Comments are only for unexpected workarounds (WORKAROUND:) and for
      facts a name cannot carry, such as hardware behaviour or ordering
      (WHY:). Otherwise use clearer labels and constant names so the code
      explains itself.
    paths:
      include:
        - "*.asm"
    pattern-regex: ';(?!\s*(?:WORKAROUND|WHY):).*'
